name: iOS → TestFlight

# Manual: Actions → "iOS → TestFlight" → Run workflow.
# Requiere los secretos descritos en ios/fastlane/Fastfile.
on:
  workflow_dispatch:
    inputs:
      create_certificates:
        description: "Primera vez: crear certificado y perfil de distribución (match)"
        type: boolean
        default: false

jobs:
  testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
      MATCH_READONLY: ${{ inputs.create_certificates && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar acceso al repo de certificados
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          AUTH=$(printf 'bdortiz16:%s' "$MATCH_GIT_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios
      - name: Usar el Xcode más reciente
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XCODE"; sudo xcode-select -s "$XCODE"; xcodebuild -version
      - run: brew install xcodegen
      - run: bundle exec fastlane beta
