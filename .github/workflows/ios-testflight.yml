name: iOS → TestFlight

# Manual: Actions → "iOS → TestFlight" → Run workflow.
# También corre al hacer push a la rama `testflight` (git push origin main:testflight).
# Requiere los secretos descritos en ios/fastlane/Fastfile.
on:
  workflow_dispatch:
  push:
    branches: [testflight]

jobs:
  testflight:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
      MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Preparar acceso al repo de certificados
        env:
          MATCH_GIT_TOKEN: ${{ secrets.MATCH_GIT_TOKEN }}
        run: |
          AUTH=$(printf 'bdortiz16:%s' "$MATCH_GIT_TOKEN" | base64 | tr -d '\n')
          echo "::add-mask::$AUTH"
          echo "MATCH_GIT_BASIC_AUTHORIZATION=$AUTH" >> "$GITHUB_ENV"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios
      - name: Usar el Xcode más reciente
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XCODE"; sudo xcode-select -s "$XCODE"; xcodebuild -version
      - run: brew install xcodegen
      - name: Fastlane beta
        run: |
          set -o pipefail
          bundle exec fastlane beta 2>&1 | tee fastlane.log || {
            # Publica las líneas de error como anotaciones visibles en el resumen del run.
            grep -E "\[!\]|error:|Error|ERROR|Could not|Couldn't|failed" fastlane.log | grep -v "^\s*$" | tail -15 | while IFS= read -r line; do
              echo "::error title=fastlane::${line//%/%25}"
            done
            exit 1
          }
