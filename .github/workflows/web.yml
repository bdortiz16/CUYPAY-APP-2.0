name: Web (Next.js → Cloudflare Pages)

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      # Si no se define, el portal admin usa datos simulados (modo demo).
      NEXT_PUBLIC_ADMIN_API_BASE: ${{ vars.NEXT_PUBLIC_ADMIN_API_BASE }}
      NEXT_PUBLIC_ADMIN_MOCK: ${{ vars.NEXT_PUBLIC_ADMIN_MOCK }}
      NEXT_PUBLIC_TESTFLIGHT_URL: ${{ vars.NEXT_PUBLIC_TESTFLIGHT_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-out
          path: web/out
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.cuypay.com
    steps:
      - uses: actions/checkout@v4

      - name: Verificar secretos de Cloudflare
        id: secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Faltan CLOUDFLARE_API_TOKEN o CLOUDFLARE_ACCOUNT_ID; se omite el despliegue."
          fi

      - uses: actions/download-artifact@v4
        if: steps.secrets.outputs.ok == 'true'
        with:
          name: web-out
          path: web/out

      - name: Desplegar en Cloudflare Pages
        if: steps.secrets.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          command: pages deploy out --project-name=cuypay-web --branch=main
