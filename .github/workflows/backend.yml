name: Backend CI

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t cuypay-backend:${{ github.sha }} backend

  deploy:
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Build backend dist
        working-directory: backend
        run: |
          npm ci
          npm run build
          tar -czf /tmp/backend-dist.tar.gz dist
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::433213575044:role/GitHubActionsCuyPayDeployRole
          aws-region: us-east-2
      - name: Upload and deploy to EC2 via SSM
        run: |
          aws s3 cp /tmp/backend-dist.tar.gz s3://cuypay-builds-433213575044/backend-dist.tar.gz
          PRESIGNED_URL=$(aws s3 presign s3://cuypay-builds-433213575044/backend-dist.tar.gz --expires-in 3600)
          CMD_ID=$(aws ssm send-command \
            --instance-ids i-09bdb8b8aa495588f \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"set -e\",\"mkdir -p /opt/cuypay\",\"docker cp cuypay-backend:/tmp/cuypay_store.json /opt/cuypay/cuypay_store.backup.json || true\",\"rm -rf /tmp/deploy-dist && mkdir -p /tmp/deploy-dist\",\"curl -fsSL '${PRESIGNED_URL}' -o /tmp/deploy-dist/backend-dist.tar.gz\",\"tar -xzf /tmp/deploy-dist/backend-dist.tar.gz -C /tmp/deploy-dist\",\"docker cp /tmp/deploy-dist/dist/. cuypay-backend:/app/dist/\",\"docker restart cuypay-backend\",\"sleep 4\",\"curl -fsSL http://127.0.0.1:8080/health\"]" \
            --query "Command.CommandId" --output text)
          for i in $(seq 1 15); do
            sleep 3
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09bdb8b8aa495588f --query "Status" --output text 2>/dev/null || echo "Pending")
            echo "SSM Status: $STATUS"
            if [ "$STATUS" = "Success" ]; then exit 0; fi
            if [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id i-09bdb8b8aa495588f
              exit 1
            fi
          done
          exit 1

